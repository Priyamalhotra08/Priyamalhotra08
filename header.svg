<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Priya Malhotra — Full Stack Developer">
<defs>
  <linearGradient id="ph-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#2a0d1c"/>
  </linearGradient>
  <pattern id="ph-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#451126" stroke-width=".7"/>
  </pattern>
  <radialGradient id="ph-fade" cx=".5" cy=".5" r=".62">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <mask id="ph-mask"><rect width="1000" height="280" fill="url(#ph-fade)"/></mask>
  <radialGradient id="ph-light" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#C77B9B" stop-opacity=".45"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ph-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".3" stop-color="#C77B9B"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset=".7" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    <animate attributeName="x1" values="-.6;.4;-.6" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values=".4;1.4;.4" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ph-name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F8F0F3"/><stop offset=".46" stop-color="#F8F0F3"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset=".54" stop-color="#F8F0F3"/><stop offset="1" stop-color="#F8F0F3"/>
    <animate attributeName="x1" values="-1.2;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-.2;2" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="ph-glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>

<rect width="1000" height="280" rx="22" fill="url(#ph-bg)"/>
<rect width="1000" height="280" rx="22" fill="url(#ph-grid)" mask="url(#ph-mask)" opacity=".75"/>

<!-- moving light -->
<ellipse cx="260" cy="140" rx="260" ry="170" fill="url(#ph-light)">
  <animate attributeName="cx" values="220;780;220" dur="14s" repeatCount="indefinite"/>
</ellipse>

<!-- orbital geometry -->
<g transform="translate(860 70)" fill="none" stroke="#C77B9B">
  <ellipse rx="92" ry="34" stroke-opacity=".35"><animateTransform attributeName="transform" type="rotate" values="-18;342" dur="40s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="62" ry="62" stroke-opacity=".22" stroke-dasharray="3 7"/>
  <ellipse rx="120" ry="44" stroke-opacity=".18"><animateTransform attributeName="transform" type="rotate" values="30;-330" dur="60s" repeatCount="indefinite"/></ellipse>
  <circle r="3.5" fill="#E5B5C7" stroke="none"><animateMotion dur="9s" repeatCount="indefinite" path="M62 0 A62 62 0 1 1 -62 0 A62 62 0 1 1 62 0"/></circle>
</g>
<g transform="translate(110 220)" fill="none" stroke="#C77B9B" stroke-opacity=".25">
  <circle r="38" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#C77B9B" stroke="none" fill-opacity=".8"><animateMotion dur="7s" repeatCount="indefinite" path="M38 0 A38 38 0 1 0 -38 0 A38 38 0 1 0 38 0"/></circle>
</g>

<!-- drawn circuit path -->
<path d="M40 238 H210 L240 208 H420 L440 228 H600 L630 198 H800 L830 228 H960" fill="none" stroke="#701A3D" stroke-width="1.6"/>
<path d="M40 238 H210 L240 208 H420 L440 228 H600 L630 198 H800 L830 228 H960" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="120 1100">
  <animate attributeName="stroke-dashoffset" values="1220;0" dur="5s" repeatCount="indefinite"/>
</path>
<g fill="#C77B9B"><circle cx="240" cy="208" r="3"/><circle cx="440" cy="228" r="3"/><circle cx="630" cy="198" r="3"/><circle cx="830" cy="228" r="3"/></g>

<!-- text -->
<text x="500" y="62" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" letter-spacing="5" fill="#C77B9B">// HELLO WORLD, I'M</text>
<text x="500" y="128" text-anchor="middle" font-family="'Segoe UI',Poppins,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#ph-name)">Priya Malhotra</text>
<rect x="330" y="146" width="340" height="3" rx="1.5" fill="url(#ph-line)" filter="url(#ph-glow)"/>
<rect x="330" y="146" width="340" height="2" rx="1" fill="url(#ph-line)"/>
<text x="500" y="180" text-anchor="middle" font-family="'Segoe UI',Poppins,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#E5B5C7">Full Stack Developer  ·  MERN  ·  AI &amp; RAG  ·  DevOps</text>
</svg>
