<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2f92"/><stop offset=".5" stop-color="#ff85c8"/><stop offset="1" stop-color="#c56cf0"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffd6ec"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
    <animate attributeName="x1" values="-1.5;1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-0.5;2" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .w1{animation:w 7s ease-in-out infinite alternate}
  .w2{animation:w 9s ease-in-out infinite alternate-reverse}
  @keyframes w{to{transform:translateX(-120px)}}
  .tw{animation:tw 2.2s ease-in-out infinite}
  .tw:nth-child(2n){animation-delay:-.7s}.tw:nth-child(3n){animation-delay:-1.4s}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  .title{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 6px #ff4fa3)}50%{filter:drop-shadow(0 0 18px #ff85c8)}}
  text{font-family:'Segoe UI',Poppins,Helvetica,Arial,sans-serif}
</style>
<rect width="1000" height="230" fill="url(#g)"/>
<g class="w1" opacity=".35"><path d="M0 170 Q125 130 250 170 T500 170 T750 170 T1000 170 T1250 170 V230 H0Z" fill="#ffffff"/></g>
<g class="w2" opacity=".25"><path d="M0 185 Q125 220 250 185 T500 185 T750 185 T1000 185 T1250 185 V230 H0Z" fill="#2b0f24"/></g>
<g fill="#fff">
  <circle class="tw" cx="80" cy="40" r="3"/><circle class="tw" cx="920" cy="50" r="3.5"/><circle class="tw" cx="200" cy="120" r="2"/>
  <circle class="tw" cx="820" cy="130" r="2.4"/><circle class="tw" cx="520" cy="25" r="2"/><circle class="tw" cx="360" cy="45" r="1.8"/>
  <circle class="tw" cx="680" cy="40" r="2.2"/><circle class="tw" cx="960" cy="150" r="1.8"/><circle class="tw" cx="40" cy="140" r="2"/>
</g>
<text class="title" x="500" y="100" text-anchor="middle" font-size="66" font-weight="800" fill="url(#shine)">Priya Malhotra</text>
<text x="500" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff" opacity=".95">Full Stack Developer  •  MERN  •  AI &amp; RAG  •  DevOps</text>
</svg>
